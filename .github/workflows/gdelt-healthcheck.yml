name: GDELT Feed Healthcheck

on:
  schedule:
    - cron: '11 10 * * *'
  workflow_dispatch:

concurrency:
  group: gdelt-healthcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check healthcheck prerequisites
        id: prereqs
        run: |
          if [ ! -f tools/gdelt_healthcheck.py ]; then
            echo "::notice::tools/gdelt_healthcheck.py is missing; healthcheck skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.prereqs.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          # no external deps yet, but leave hook for future

      - name: Run GDELT healthcheck
        if: steps.prereqs.outputs.ready == 'true'
        working-directory: tools
        run: |
          python gdelt_healthcheck.py
